<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>社會心理學｜期中名詞解釋互動測驗</title>
<style>
:root{--ink:#1e2945;--muted:#63708b;--blue:#4758ce;--blue2:#3243a9;--light:#e8ebff;--good:#14785b;--goodbg:#e9f8f1;--bad:#b54151;--badbg:#fff0f2;--line:#e1e6f2;--bg:#f6f8fc;--white:#fff;--shadow:0 16px 50px rgba(30,48,102,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:920px;margin:auto;padding:28px 22px 66px}
header{background:linear-gradient(130deg,#273565,#4958bd 72%,#6e73d6);color:#fff;padding:40px 42px 32px;border-radius:26px;position:relative;overflow:hidden;box-shadow:0 18px 44px rgba(39,53,101,.18)}
header:after{content:"";height:220px;width:220px;border:1px solid #ffffff35;border-radius:50%;position:absolute;right:-70px;top:-95px;box-shadow:0 0 0 42px #ffffff0d,0 0 0 84px #ffffff0b}
.eyebrow{font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:12px;opacity:.87}
h1{font-size:clamp(25px,4.5vw,37px);line-height:1.26;margin:14px 0 12px;letter-spacing:.02em}
header p{max-width:660px;margin:0;color:#e8ebff;font-size:14px}header .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:23px}
.chip{border:1px solid #ffffff65;background:#ffffff20;border-radius:100px;padding:4px 12px;font-size:12px}
main{margin-top:22px}
.card{background:#fff;border:1px solid #e8edf5;border-radius:22px;box-shadow:var(--shadow);padding:28px}
.mode-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.smalllabel{color:var(--muted);font-size:12px;letter-spacing:.06em;font-weight:700}
.mode-header strong{font-size:17px}
.mode-tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#f0f3f9;border-radius:14px;padding:5px;gap:5px}
.mode-btn{color:#4f5f7a;font-size:14px;font-weight:700;background:transparent;border:0;border-radius:11px;padding:13px 8px;line-height:1.45}
.mode-btn[aria-selected="true"]{background:#fff;color:var(--blue2);box-shadow:0 2px 12px #30386718}
.info-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:17px}
#modeDesc{color:var(--muted);font-size:13px;margin:0}.tiny-btn{border:1px solid #d9def0;border-radius:9px;background:#fff;padding:7px 10px;color:#4354a7;font-size:12px;font-weight:700}
#contentCard{margin-top:20px}
.progress-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:650;align-items:center}
.track{height:8px;background:#eaeef7;border-radius:10px;overflow:hidden;margin:10px 0 23px}
.track>div{height:100%;background:linear-gradient(90deg,#707de9,#4054c6);width:0;transition:width .25s}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta span{font-size:12px;border-radius:30px;background:#edf1fb;color:#5b698c;padding:5px 11px;font-weight:700}
.question-kicker{margin:25px 0 8px;font-size:12px;letter-spacing:.1em;color:#5363b3;font-weight:800}
.prompt{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(19px,2.8vw,24px);line-height:1.65;font-weight:600;margin:0 0 24px;color:#253257}
.prompt.term-only{font-family:inherit;font-size:clamp(25px,4.5vw,34px);color:#313fb1;font-weight:800}
.option-grid{display:grid;gap:11px}
.option{display:flex;align-items:center;gap:13px;text-align:left;border:1.5px solid #dbe2ef;border-radius:13px;background:#fff;padding:15px 17px;color:#273454;font-weight:650;min-height:62px}
.option:hover:not(:disabled){border-color:#7b86d9;background:#f7f8ff}
.option:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #a3b0ff;outline-offset:2px}
.option .letter{border-radius:9px;background:#f0f2f9;color:#657492;width:30px;height:30px;display:grid;place-items:center;flex:0 0 auto;font-size:13px}
.option.selected{border-color:#5a6ad6;background:#f2f4ff}.option.correct{border-color:#25a17c;background:#effbf5}.option.incorrect{border-color:#e36c7c;background:#fff1f3}
.option:disabled{cursor:default;opacity:1}
.answer-input{width:100%;border:1.5px solid #c9d1e4;border-radius:12px;background:#fff;padding:14px 16px;outline:none;color:var(--ink)}
.answer-input:focus{border-color:#5c6ad8}
textarea.answer-input{min-height:165px;resize:vertical}
.hintline{font-size:12px;color:var(--muted);margin:8px 0 0}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}
.action-primary,.action-alt,.action-danger{border:0;border-radius:12px;padding:12px 22px;font-size:14px;font-weight:750;min-height:45px}
.action-primary{background:var(--blue);color:#fff}.action-primary:hover{background:#3346bd}
.action-primary:disabled{background:#aab4db;cursor:not-allowed}
.action-alt{background:#eef1fa;color:#4353a7}.action-alt:hover{background:#e1e6f8}
.action-danger{background:#fff0f2;color:#a8374b}
.feedback{margin-top:25px;border-radius:16px;padding:19px 20px;border:1px solid #dfe5f2;background:#f8faff}
.feedback.good{background:var(--goodbg);border-color:#bae5d3}.feedback.bad{background:var(--badbg);border-color:#f3ccd3}
.result-top{font-size:15px;font-weight:800;margin-bottom:10px}
.reference{background:#fff;border:1px solid #e3e8f0;border-radius:12px;padding:13px 16px;line-height:1.65;margin-top:11px;font-family:Georgia,serif}
.trans{margin:12px 0 0;font-size:13px;color:#485773}
.source{font-size:12px;color:#65738f;margin:12px 0 0}
.keyword-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.keyword{font-size:12px;border:1px solid #dbe2ef;color:#58657e;background:#fff;border-radius:20px;padding:3px 8px}
.keyword.found{background:#e4f8ef;border-color:#aad9c6;color:#126b51}
.completion{text-align:center;padding:12px 0 0}
.bigscore{font-size:54px;font-weight:850;line-height:1.1;color:#3648bc;margin:12px 0}
.review-list{text-align:left;margin-top:24px;border-top:1px solid var(--line);padding-top:20px;display:grid;gap:10px}
.review-row{display:flex;gap:10px;align-items:baseline;justify-content:space-between;border-bottom:1px solid #edf0f8;padding:5px 0 10px}
.review-row .mark{font-size:12px;border-radius:99px;padding:2px 8px;font-weight:700;white-space:nowrap}
.mark.pass{color:#14785b;background:#e6f7ee}.mark.fail{color:#b54151;background:#fff0f2}
.note{margin:21px 2px 0;color:#6e7994;font-size:12px}
#notice{color:#ad3a4b;font-size:13px;margin-top:8px;min-height:2px}
@media(max-width:560px){.shell{padding:12px 12px 45px}header{border-radius:18px;padding:28px 23px}h1{font-size:26px}.card{border-radius:17px;padding:20px 17px}.mode-btn{font-size:12px;padding:10px 4px}.mode-header strong{font-size:15px}.info-row{align-items:flex-start}.option{padding:13px}.prompt{font-size:19px}.bigscore{font-size:48px}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="eyebrow">Social Psychology · Midterm 2026</div>
    <h1>社會心理學<br>名詞解釋互動測驗</h1>
    <p>依照老師指定的 10 個名詞、你提供的第 1／2／5 章教材製作。選擇題 → 英文填空 → 完整名詞解釋，逐步練習到能自行寫出來。</p>
    <div class="chips"><span class="chip">10 個必考範圍名詞</span><span class="chip">3 種模式</span><span class="chip">逐題批改</span><span class="chip">原文頁碼</span></div>
  </header>
  <main>
    <section class="card" aria-label="測驗模式">
      <div class="mode-header"><div><div class="smalllabel">PRACTICE MODE</div><strong>選擇你的練習方式</strong></div><span id="modeLabel" class="smalllabel">01 / 03</span></div>
      <div class="mode-tabs" role="tablist" aria-label="練習模式">
        <button type="button" class="mode-btn" data-mode="choice" role="tab" aria-selected="true">① 選擇題</button>
        <button type="button" class="mode-btn" data-mode="fill" role="tab" aria-selected="false">② 英文填空</button>
        <button type="button" class="mode-btn" data-mode="recall" role="tab" aria-selected="false">③ 純名詞解釋</button>
      </div>
      <div class="info-row"><p id="modeDesc">看英文定義，從四個名詞中選出答案。</p><button class="tiny-btn" id="shuffleBtn" type="button">重新洗牌</button></div>
    </section>
    <section id="contentCard" class="card" aria-label="互動測驗">
      <div class="progress-head"><span id="progressText">第 1 / 10 題</span><span id="scoreText">目前答對 0 題</span></div>
      <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="progressbar"><div id="progressBar"></div></div>
      <div id="stage" aria-live="polite"></div>
    </section>
    <p class="note">備註：完整名詞解釋採「與課本對照後自評」，避免系統將意思正確、但用字不同的英文句子誤判為錯誤。學習結果僅保留在目前頁面，不會上傳。</p>
  </main>
</div>
<script>
const BANK = [{"term": "Social Psychology", "zh": "社會心理學", "chap": "第1章", "page": 6, "pdf": 4, "definition": "The scientific study of how individuals think, feel, and behave in a social context.", "cn": "研究個人在社會情境中如何思考、感受及行動的科學。", "blank": "social context", "keywords": ["scientific study", "think", "feel", "behave", "social context"], "near": ["Social Identity Theory", "Contact Hypothesis", "Correlational Research"]}, {"term": "Open Science", "zh": "開放科學", "chap": "第1章", "page": 20, "pdf": 18, "definition": "A movement to make research materials, methods, hypotheses, and data more transparent, accessible, and easily shared with researchers from other labs.", "cn": "使研究材料、方法、假設及資料更加透明、容易取得，並易於與其他實驗室研究者共享的運動。", "blank": "transparent", "keywords": ["research materials", "methods", "hypotheses", "data", "transparent", "accessible", "shared"], "near": ["External Validity", "Experiment", "Correlational Research"]}, {"term": "Correlational Research", "zh": "相關研究", "chap": "第2章", "page": 34, "pdf": 32, "definition": "Research designed to measure the association between variables that are not manipulated by the researcher.", "cn": "用來測量研究者未操弄的變項之間關聯性的研究方法。", "blank": "association", "keywords": ["measure", "association", "variables", "not manipulated"], "near": ["Experiment", "Random Sampling", "Random Assignment"]}, {"term": "Experiment", "zh": "實驗", "chap": "第2章", "page": 36, "pdf": 34, "definition": "A form of research that can demonstrate causal relationships because (1) the experimenter has control over the events that occur and (2) participants are randomly assigned to conditions.", "cn": "能夠建立因果關係的研究方式，因為實驗者能控制事件，且參與者被隨機分派到各實驗條件。", "blank": "causal relationships", "keywords": ["causal relationships", "control", "randomly assigned", "conditions"], "near": ["Correlational Research", "Random Assignment", "External Validity"]}, {"term": "External Validity", "zh": "外在效度", "chap": "第2章", "page": 41, "pdf": 39, "definition": "The degree to which there can be reasonable confidence that the results of a study would be obtained for other people and in other situations.", "cn": "研究結果能否有合理信心推廣到其他人或其他情境的程度。", "blank": "other people", "keywords": ["degree", "results", "other people", "other situations"], "near": ["Open Science", "Random Sampling", "Correlational Research"]}, {"term": "Random Assignment", "zh": "隨機分派", "chap": "第2章", "page": 37, "pdf": 35, "definition": "A method of assigning participants to the various conditions of an experiment so that each participant in the experiment has an equal chance of being in any of the conditions.", "cn": "將參與者分派到不同實驗條件，使每個人都有同等機會進入任一條件的方法。", "blank": "equal chance", "keywords": ["assigning participants", "conditions", "experiment", "equal chance"], "near": ["Random Sampling", "Experiment", "Correlational Research"]}, {"term": "Random Sampling", "zh": "隨機抽樣", "chap": "第2章", "page": 33, "pdf": 31, "definition": "A method of selecting participants for a study so that everyone in a population has an equal chance of being in the study.", "cn": "從母群體選出研究參與者，使每個人都有同等機會被選入研究的方法。", "blank": "population", "keywords": ["selecting participants", "population", "equal chance", "study"], "near": ["Random Assignment", "External Validity", "Correlational Research"]}, {"term": "Realistic Conflict Theory", "zh": "現實衝突理論", "chap": "第5章", "page": 180, "pdf": 29, "definition": "The theory that hostility between groups is caused by direct competition for limited resources.", "cn": "認為群體間的敵意源自對有限資源的直接競爭的理論。", "blank": "limited resources", "keywords": ["hostility", "groups", "direct competition", "limited resources"], "near": ["Social Identity Theory", "Contact Hypothesis", "Social Psychology"]}, {"term": "Social Identity Theory", "zh": "社會認同理論", "chap": "第5章", "page": 181, "pdf": 30, "definition": "The theory that people favor ingroups over outgroups in order to enhance their self-esteem.", "cn": "認為人們為了提升自尊，會偏好內團體勝於外團體的理論。", "blank": "self-esteem", "keywords": ["favor", "ingroups", "outgroups", "self-esteem"], "near": ["Realistic Conflict Theory", "Contact Hypothesis", "Social Psychology"]}, {"term": "Contact Hypothesis", "zh": "接觸假說", "chap": "第5章", "page": 195, "pdf": 44, "definition": "The theory that direct contact between hostile groups will reduce intergroup prejudice under certain conditions.", "cn": "認為在特定條件下，敵對群體間的直接接觸可以減少群際偏見的理論。", "blank": "intergroup prejudice", "keywords": ["direct contact", "hostile groups", "intergroup prejudice", "certain conditions"], "near": ["Realistic Conflict Theory", "Social Identity Theory", "Random Assignment"]}];
const byTerm = Object.fromEntries(BANK.map(x => [x.term,x]));
const modes = {
 choice: {label:"01 / 03",desc:"看英文定義，從四個名詞中選出答案。"},
 fill: {label:"02 / 03",desc:"補上課本英文定義中缺少的關鍵字或片語。"},
 recall: {label:"03 / 03",desc:"只顯示英文名詞，自己寫出完整英文解釋；看原文後自評。"}
};
const $ = (id) => document.getElementById(id);
const escapeHtml=(s)=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=(a)=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const normalize=(s)=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
let state={mode:"choice",queue:[],index:0,answers:[],selected:null,draft:"",revealed:false,choices:[]};
function init(mode="choice",list=null){
 state={mode,queue:list||shuffle(BANK.map(x=>x.term)),index:0,answers:[],selected:null,draft:"",revealed:false,choices:[]};
 setOptions();render();
}
function setOptions(){
 const item=byTerm[state.queue[state.index]];
 if(item) state.choices=shuffle([item.term,...item.near]);
}
function setMode(mode){init(mode)}
function current(){return byTerm[state.queue[state.index]]}
function currCorrect(){return state.answers.filter(a=>a.correct).length}
function render(){
 document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.mode===state.mode)));
 $("modeLabel").textContent=modes[state.mode].label;
 $("modeDesc").textContent=modes[state.mode].desc;
 const total=state.queue.length;
 const done=state.index>=total;
 $("progressText").textContent=done?`本輪已完成｜共 ${total} 題`:`第 ${state.index+1} / ${total} 題`;
 $("scoreText").textContent=`目前答對 ${currCorrect()} 題`;
 $("progressBar").style.width=(100*(done?total:state.index)/total)+"%";
 $("progressbar").setAttribute("aria-valuemax",String(total));
 $("progressbar").setAttribute("aria-valuenow",String(done?total:state.index));
 if(done){renderDone();return}
 const x=current();
 const top=`<div class="meta"><span>${escapeHtml(x.chap)}</span><span>考試指定名詞</span>${state.mode==="recall"?"":`<span>四選一／填空</span>`}</div>`;
 let question="",control="";
 if(state.mode==="choice"){
   question=`<div class="question-kicker">READ THE DEFINITION · 選出對應名詞</div><p class="prompt">${escapeHtml(x.definition)}</p>`;
   control=`<div class="option-grid">${state.choices.map((s,i)=>{let cls="option"+(state.selected===s?" selected":"")+(state.revealed?(s===x.term?" correct":s===state.selected?" incorrect":""):"");return `<button type="button" class="${cls}" data-choice="${escapeHtml(s)}" ${state.revealed?"disabled":""}><span class="letter">${"ABCD"[i]}</span><span>${escapeHtml(s)}</span></button>`}).join("")}</div>`;
 }else if(state.mode==="fill"){
   let parts=x.definition.split(x.blank);
   question=`<div class="question-kicker">COMPLETE THE DEFINITION · 補上英文片語</div><p class="prompt">${escapeHtml(parts[0])}<span style="color:#4c5bcc;border-bottom:2px solid #4c5bcc">□□□□□□</span>${escapeHtml(parts[1])}</p>`;
   control=`<label for="answer" class="smalllabel">請填入缺少的英文（不分大小寫）</label><input id="answer" class="answer-input" autocomplete="off" autocapitalize="off" spellcheck="false" value="${escapeHtml(state.draft)}" placeholder="在這裡輸入英文答案…" ${state.revealed?"disabled":""}>`;
 }else{
   question=`<div class="question-kicker">WRITE THE FULL DEFINITION · 完整英文名詞解釋</div><p class="prompt term-only">${escapeHtml(x.term)}</p>`;
   control=`<label for="answer" class="smalllabel">請用英文解釋這個名詞（不需逐字一模一樣）</label><textarea id="answer" class="answer-input" spellcheck="false" placeholder="Write the English definition here…" ${state.revealed?"disabled":""}>${escapeHtml(state.draft)}</textarea><p class="hintline">老師考英文書寫；此模式不會先顯示中文提示。</p>`;
 }
 let actions="";
 if(!state.revealed){
   let dis=(state.mode==="choice"&&!state.selected)||(state.mode!=="choice"&&!state.draft.trim());
   actions=`<div class="actions"><button type="button" class="action-primary" id="checkBtn" ${dis?"disabled":""}>${state.mode==="recall"?"對照課本答案":"送出答案"}</button><button type="button" class="action-alt" id="skipBtn">先略過</button></div>`;
 }else{
   const correct=state.selected===x.term; // meaningful for choice only
   let pass = state.mode==="choice"?correct:state.mode==="fill"?normalize(state.draft)===normalize(x.blank):null;
   const txt = state.mode==="recall"?"請對照下面的原文，自行判斷是否掌握重點。":pass?"回答正確！":"這題可以再加強。";
   const ref=`<div class="reference">${escapeHtml(x.definition)}</div><p class="trans">${escapeHtml(x.cn)}</p><p class="source">${escapeHtml(x.chap)}｜課本第 ${x.page} 頁｜PDF 第 ${x.pdf} 頁</p>`;
   const kw=state.mode==="recall"?`<div class="smalllabel" style="margin-top:15px">英文關鍵字比對（僅輔助；不代表正式批改）</div><div class="keyword-list">${x.keywords.map(k=>`<span class="keyword ${normalize(state.draft).includes(normalize(k))?"found":""}">${escapeHtml(k)}</span>`).join("")}</div>`:"";
   const ans=state.mode==="fill"?`<div>填空答案：<strong>${escapeHtml(x.blank)}</strong></div>`:state.mode==="choice"?`<div>正確名詞：<strong>${escapeHtml(x.term)}</strong>（${escapeHtml(x.zh)}）</div>`:"";
   actions=`<div class="feedback ${pass===null?"":pass?"good":"bad"}"><div class="result-top">${txt}</div>${ans}<div class="smalllabel" style="margin-top:12px">課本英文定義</div>${ref}${kw}</div><div class="actions">${state.mode==="recall"?`<button type="button" class="action-primary" data-assess="yes">我已掌握 ✓</button><button type="button" class="action-danger" data-assess="no">需要加強 ↻</button>`:`<button type="button" class="action-primary" id="nextBtn">${state.index+1===total?"查看成果":"下一題 →"}</button>`}</div>`;
 }
 $("stage").innerHTML=top+question+control+actions+`<div id="notice"></div>`;
 if(state.mode==="choice"&&!state.revealed){
  document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{state.selected=b.dataset.choice;render()});
 }
 if(state.mode!=="choice"&&!state.revealed){
  const inp=$("answer");
  inp.addEventListener("input",e=>{state.draft=e.target.value;$("checkBtn").disabled=!state.draft.trim()});
  if(state.mode==="fill") inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(state.draft.trim())check()}});
 }
 if($("checkBtn")) $("checkBtn").onclick=check;
 if($("skipBtn")) $("skipBtn").onclick=skip;
 if($("nextBtn")) $("nextBtn").onclick=next;
 document.querySelectorAll("[data-assess]").forEach(b=>b.onclick=()=>assess(b.dataset.assess==="yes"));
}
function check(){
 if(state.mode==="choice"&&!state.selected || state.mode!=="choice"&&!state.draft.trim())return;
 state.revealed=true;
 if(state.mode==="choice")state.answers.push({term:current().term,correct:state.selected===current().term,entry:state.selected});
 if(state.mode==="fill")state.answers.push({term:current().term,correct:normalize(state.draft)===normalize(current().blank),entry:state.draft});
 render();
}
function assess(correct){
 state.answers.push({term:current().term,correct,entry:state.draft});
 next();
}
function skip(){
 state.answers.push({term:current().term,correct:false,entry:"（略過）"});
 next();
}
function next(){
 state.index++;state.selected=null;state.draft="";state.revealed=false;setOptions();render();
 $("contentCard").scrollIntoView({behavior:"smooth",block:"start"});
}
function renderDone(){
 const correct=currCorrect(), total=state.queue.length;
 const wrong=state.answers.filter(a=>!a.correct).map(a=>a.term);
 $("stage").innerHTML=`<div class="completion"><div class="smalllabel">PRACTICE COMPLETE</div><h2 style="margin:8px 0 0">這輪完成了！</h2><div class="bigscore">${correct}<span style="font-size:20px;color:#8993b0"> / ${total}</span></div><p style="color:var(--muted);margin:0">${state.mode==="recall"?"依你的自評結果統計":`正確率 ${Math.round(100*correct/total)}%`}</p><div class="actions" style="justify-content:center"><button class="action-primary" type="button" id="again">全部再練一次</button>${wrong.length?`<button class="action-alt" type="button" id="wrongOnly">只練 ${wrong.length} 題需要加強的名詞</button>`:""}</div></div><div class="review-list"><div class="smalllabel">本輪結果</div>${state.answers.map(a=>{let x=byTerm[a.term];return `<div class="review-row"><div><strong>${escapeHtml(x.term)}</strong><div style="color:#7a879f;font-size:12px">${escapeHtml(x.zh)} · 課本 P.${x.page}</div></div><span class="mark ${a.correct?"pass":"fail"}">${a.correct?"已掌握":"待加強"}</span></div>`}).join("")}</div>`;
 $("again").onclick=()=>init(state.mode);
 if($("wrongOnly"))$("wrongOnly").onclick=()=>init(state.mode,shuffle(wrong));
}
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));
$("shuffleBtn").onclick=()=>init(state.mode);
init("choice");
</script>
</body>
</html>
